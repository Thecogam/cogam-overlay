<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cogam Overlay</title>
<meta name="viewport" content="width=1920, height=1080">
<style>html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; overflow: hidden; } body.preview { background: linear-gradient(180deg, #0a1030, #1b1446 45%, #3a1a4f 60%, #07060f); }</style>
</head>
<body>
<script>
// Preview page for the overlay. ?demo, ?preview, ?debug, ?channel=name. Streamlabs loads widget.js directly.
const p = new URLSearchParams(location.search);
window.COGAM_DEMO = p.has('demo'); window.COGAM_DEBUG = p.has('debug');
if (p.get('channel')) window.COGAM_CHANNEL = p.get('channel');
if (p.has('preview')) document.body.classList.add('preview');
</script>
<script src="widget.js"></script>
</body>
</html>
