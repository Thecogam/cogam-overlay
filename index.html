<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cogam Overlay (test)</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* Streamlabs browser source: 1920x1080, transparent background. Test slice of the Neon Tube overlay. */
:root { --night: #0c0720; --pink: #ff2e88; --orange: #ff8a3d; --cyan: #19e3ff; --gold: #ffd25e; --f-neon: "Monoton", Impact, sans-serif; --f-ui: "Chakra Petch", Consolas, monospace; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: var(--f-ui); color: #fff; }
body.preview { background: linear-gradient(180deg, #0a1030, #1b1446 45%, #3a1a4f 60%, #07060f); }

.heat { position: absolute; left: 50%; top: 34px; transform: translateX(-50%); padding: 12px 26px; display: grid; justify-items: center; gap: 4px;
  border: 3px solid var(--pink); border-radius: 18px; background: rgba(12,7,32,.55);
  box-shadow: 0 0 8px var(--pink), 0 0 22px rgba(255,46,136,.6), inset 0 0 14px rgba(255,46,136,.35); }
.heat .label { font-size: 15px; letter-spacing: .4em; color: #ffd9ea; text-transform: uppercase; text-shadow: 0 0 6px var(--pink); }
.stars { display: flex; gap: 10px; font-size: 44px; line-height: 1; }
.stars span { color: rgba(255,255,255,.14); transition: color .35s, text-shadow .35s, transform .35s; }
.stars span.on { color: var(--gold); text-shadow: 0 0 10px var(--gold), 0 0 24px var(--orange); transform: scale(1.08); }

.drop { position: absolute; left: 50%; top: 170px; transform: translateX(-50%); min-width: 560px; padding: 20px 34px; text-align: center; display: grid; gap: 6px;
  border: 3px solid var(--cyan); border-radius: 20px; background: rgba(12,7,32,.85);
  box-shadow: 0 0 10px var(--cyan), 0 0 34px var(--cyan), inset 0 0 18px rgba(25,227,255,.4); }
.drop[hidden] { display: none; }
.drop .kind { font-size: 18px; letter-spacing: .35em; color: var(--gold); text-transform: uppercase; }
.drop .who { font-size: 42px; font-weight: 700; color: #dcfaff; text-shadow: 0 0 8px var(--cyan), 0 0 20px var(--cyan); }
.drop .crate { font-size: 70px; line-height: 1; filter: drop-shadow(0 0 14px var(--cyan)); }
.drop .left { font-size: 24px; color: #fff; }
.drop .left b { color: var(--gold); }

.max { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 10px; background: radial-gradient(circle, rgba(255,46,136,.35), rgba(12,7,32,.8) 70%); }
.max[hidden] { display: none; }
.max .big { font-family: var(--f-neon); font-size: 150px; color: #ffd9ea; text-shadow: 0 0 6px #fff, 0 0 18px var(--pink), 0 0 50px var(--pink); }
.max .stars { font-size: 80px; justify-content: center; }
.max .stars span { color: var(--gold); text-shadow: 0 0 14px var(--gold), 0 0 30px var(--orange); }

.debug { position: absolute; left: 20px; bottom: 20px; font-size: 18px; padding: 6px 12px; border-radius: 8px; background: rgba(0,0,0,.6); }
.debug[hidden] { display: none; }

@media (prefers-reduced-motion: no-preference) {
  .drop:not([hidden]) { animation: tubeIn .9s both; }
  .drop .crate { animation: bob 1.2s ease-in-out infinite; }
  .max:not([hidden]) .big { animation: slam .7s cubic-bezier(.2,1.4,.3,1) both; }
  body.shake { animation: shake .5s; }
  @keyframes tubeIn { 0% { opacity: 0; } 10% { opacity: 1; } 16% { opacity: .1; } 24% { opacity: 1; } 30% { opacity: .3; } 40%, 100% { opacity: 1; } }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
  @keyframes slam { 0% { transform: scale(2.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes shake { 0%, 100% { translate: 0 0; } 25% { translate: -10px 6px; } 50% { translate: 9px -6px; } 75% { translate: -5px 3px; } }
}
</style>
</head>
<body>
<div class="heat"><div class="label">Chat heat</div><div class="stars" id="heat"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div></div>
<div class="drop" id="drop" hidden><div class="kind">Crew drop</div><div class="crate">📦</div><div class="who" id="drop-who"></div><div class="left">Type <b>!grab</b> · <b id="drop-left">10</b> crates left</div></div>
<div class="max" id="max" hidden><div class="big">SIX STARS</div><div class="stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div></div>
<div class="debug" id="debug" hidden>connecting…</div>

<script>
// Reads Twitch chat anonymously (read-only IRC over WebSocket). No login, no secrets.
const params = new URLSearchParams(location.search);
const CHANNEL = (params.get('channel') || 'thecogam').toLowerCase();
const DEBUG = params.has('debug');
if (params.has('preview')) document.body.classList.add('preview');
const dbg = document.getElementById('debug');
dbg.hidden = !DEBUG;
const log = (t) => { if (DEBUG) dbg.textContent = t; };

// ---- Heat meter: same rules as the engine (chat spike over the stream's own pace + decaying boosts) ----
const HYPE = ['no way', 'omg', 'lets go', "let's go", 'w', 'lul', 'lmao', 'insane', 'clip it', 'pog'];
let msgs = [], baseline = 0, samples = 0, boost = 0, stars = 0, last = 0, maxedAt = -Infinity;
const heatEls = [...document.querySelectorAll('#heat span')];
function hype(text) { const t = ` ${text.toLowerCase()} `; return HYPE.some((w) => (w.length <= 2 ? t.includes(` ${w} `) : t.includes(w))) ? 0.15 : 0; }
function tick() {
  const now = Date.now(), dt = last ? (now - last) / 1000 : 0; last = now;
  boost = Math.max(0, boost - dt / 45);
  msgs = msgs.filter((t) => now - t <= 30000);
  const rate = msgs.length; samples++;
  const a = samples < 12 ? 0.3 : rate > baseline * 2 ? 0.01 : 0.05;
  baseline += a * (rate - baseline);
  const z = (rate - baseline) / Math.max(1, Math.sqrt(Math.max(baseline, 1)));
  stars = Math.min(6, Math.floor(Math.max(0, z / 1.5) + boost));
  heatEls.forEach((s, i) => s.classList.toggle('on', i < stars));
  if (stars >= 6 && now - maxedAt > 180000) { maxedAt = now; boost = 0; showMax(); }
}
setInterval(tick, 5000);

function showMax() {
  const m = document.getElementById('max'); m.hidden = false;
  document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake');
  setTimeout(() => (m.hidden = true), 4800);
}

// ---- Crew Drop: opens on a sub/gift (or CogamCrew's announcement), counts !grab ----
let drop = null;
function startDrop(who, crates) {
  if (drop) { drop.left += crates; document.getElementById('drop-left').textContent = drop.left; return; }
  drop = { left: crates, grabbed: new Set() };
  document.getElementById('drop-who').textContent = `from ${who}`;
  document.getElementById('drop-left').textContent = crates;
  document.getElementById('drop').hidden = false;
  drop.timer = setTimeout(endDrop, 45000);
}
function endDrop() { if (!drop) return; clearTimeout(drop.timer); drop = null; document.getElementById('drop').hidden = true; }
function grab(user) {
  if (!drop || drop.grabbed.has(user)) return;
  drop.grabbed.add(user); drop.left--;
  document.getElementById('drop-left').textContent = drop.left;
  if (drop.left <= 0) setTimeout(endDrop, 1200);
}

// ---- Twitch IRC ----
function tags(raw) { const o = {}; raw.slice(1).split(';').forEach((kv) => { const i = kv.indexOf('='); o[kv.slice(0, i)] = kv.slice(i + 1); }); return o; }
function onLine(line) {
  if (line.startsWith('PING')) return ws.send('PONG :tmi.twitch.tv');
  const m = line.match(/^(@\S+ )?:(\S+?)!?\S* (PRIVMSG|USERNOTICE) #\S+ ?:?(.*)$/);
  if (!m) return;
  const t = m[1] ? tags(m[1].trim()) : {}, user = (m[2] || '').toLowerCase(), cmd = m[3], text = m[4] || '';
  if (cmd === 'PRIVMSG') {
    const isBot = text.startsWith('🤖 CogamCrew:');
    if (!isBot) { msgs.push(Date.now()); boost += hype(text); }
    if (t.bits) boost += Number(t.bits) / 100;
    if (text.trim().toLowerCase() === '!grab') grab(user);
    const d = isBot && text.match(/CREW DROP from (.+?)!/);
    if (d) startDrop(d[1], 10);
    log(`connected · #${CHANNEL} · heat ${stars}`);
  } else if (cmd === 'USERNOTICE') {
    const kind = t['msg-id'];
    if (kind === 'sub' || kind === 'resub') boost += 1;
    if (kind === 'subgift' || kind === 'submysterygift') boost += 1;
    if (kind === 'raid') boost += 2;
  }
}
let ws;
function connect() {
  ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen = () => {
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('PASS SCHMOOPIIE');
    ws.send(`NICK justinfan${Math.floor(10000 + Math.random() * 80000)}`);
    ws.send(`JOIN #${CHANNEL}`);
    log(`connected · #${CHANNEL}`);
  };
  ws.onmessage = (e) => String(e.data).split('\r\n').filter(Boolean).forEach(onLine);
  ws.onclose = () => { log('reconnecting…'); setTimeout(connect, 3000); };
}
connect();

// ?demo=1 plays a short sequence so the look can be checked without a live chat.
if (params.has('demo')) {
  let n = 0;
  const fake = setInterval(() => { for (let i = 0; i < 3 + n; i++) { msgs.push(Date.now()); boost += 0.15; } if (++n > 10) clearInterval(fake); }, 1500);
  setTimeout(() => startDrop('nightrider_77', 10), 2000);
  [3, 4, 5, 6].forEach((s) => setTimeout(() => grab('viewer' + s), s * 1000));
}
</script>
</body>
</html>
